  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Viral AI Tool</title>
  <script>
    (() => {
      const root = document.documentElement;
      try {
        const stateKey = "viral-ai-tool-state";
        const saved = JSON.parse(localStorage.getItem(stateKey) || "{}");
        let changed = false;
        if (!saved.appearance) { saved.appearance = "midnight"; changed = true; }
        if (!saved.motion) { saved.motion = "balanced"; changed = true; }
        if (changed) localStorage.setItem(stateKey, JSON.stringify(saved));
        const themes = new Set(["aurora-light", "pearl-light", "midnight"]);
        const motions = new Set(["balanced", "expressive", "reduced"]);
        const scales = new Set(["compact", "comfortable", "large"]);
        root.dataset.theme = themes.has(saved.appearance) ? saved.appearance : "midnight";
        root.dataset.motion = motions.has(saved.motion) ? saved.motion : "balanced";
        if (scales.has(saved.scale)) root.dataset.scale = saved.scale;
        if (["vi", "en"].includes(saved.locale)) root.lang = saved.locale;
      } catch {}
    })();
  </script>
