<!doctype html>
<html lang="vi" data-theme="aurora-light" data-motion="balanced" data-scale="comfortable">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Viral AI Tool</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="core-editor.css" />
  <link rel="stylesheet" href="core-workflow.css" />
  <link rel="stylesheet" href="core-layout.css" />
</head>
<body>
  <div class="ambient-layer" aria-hidden="true">
    <span class="ambient ambient-a"></span>
    <span class="ambient ambient-b"></span>
    <span class="ambient ambient-c"></span>
  </div>

  <header class="titlebar">
    <div class="drag">
      <div class="app-icon">V</div>
      <strong>Viral AI Tool</strong>
      <span id="desktopPill" class="desktop-pill">Ứng dụng desktop</span>
    </div>
    <div class="window-controls">
      <button id="winMin" aria-label="Minimize">—</button>
      <button id="winMax" aria-label="Maximize">□</button>
      <button id="winClose" class="close" aria-label="Close">×</button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">V</div>
        <div>
          <div class="brand-name">VIRAL AI</div>
          <div class="brand-sub">CREATOR STUDIO</div>
        </div>
      </div>

      <div class="workspace">
        <div>
          <span id="workspaceLabel">Không gian làm việc</span>
          <strong>Hoàng Studio</strong>
        </div>
        <i aria-hidden="true"></i>
      </div>

      <nav id="nav" aria-label="Primary"></nav>

      <div class="sidebar-bottom">
        <div class="credit-card">
          <div class="credit-head"><span id="creditsLabel">Tín dụng tháng</span><b>2,480</b></div>
          <div class="bar animated-progress"><i style="width:66%"></i></div>
          <small><span>66%</span> <span id="remainingLabel">còn lại</span></small>
        </div>
        <div class="profile">
          <div class="avatar">NH</div>
          <div><b>Nhựt Hoàng</b><span>Creator Pro</span></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-heading">
          <div id="breadcrumb" class="breadcrumb"></div>
          <h1 id="pageTitle"></h1>
        </div>

        <div class="top-actions">
          <button class="command-palette" type="button" aria-label="Quick search">
            <span class="command-icon">⌕</span>
            <span class="command-copy">Search anything</span>
            <kbd>Ctrl K</kbd>
          </button>

          <div class="language-control">
            <button id="langMenuButton" class="select-trigger language-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="select-leading">文</span>
              <span class="select-value">
                <small id="langHint">Language</small>
                <strong id="langName">Tiếng Việt</strong>
              </span>
              <span class="select-chevron" aria-hidden="true">▾</span>
            </button>
            <div id="langMenu" class="popover-menu hidden" role="listbox" aria-label="Language">
              <button class="popover-option" type="button" data-locale="vi" role="option">
                <span class="option-code">VI</span>
                <span><b>Tiếng Việt</b><small>Vietnamese</small></span>
                <span class="option-check">✓</span>
              </button>
              <button class="popover-option" type="button" data-locale="en" role="option">
                <span class="option-code">EN</span>
                <span><b>English</b><small>English</small></span>
                <span class="option-check">✓</span>
              </button>
            </div>
          </div>

          <button id="quickProject" class="button primary" type="button">
            <span class="button-spark" aria-hidden="true">✦</span>
            <span id="newProjectLabel">Dự án mới</span>
          </button>
        </div>
      </header>

      <section id="page" class="page" aria-live="polite"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal" class="modal-backdrop hidden"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="core-player-model.js"></script>
  <script src="core-player.js"></script>
  <script src="core-workflow-model.js"></script>
  <script src="core-workflow.js"></script>
  <script src="core-layout.js"></script>
</body>
</html>
