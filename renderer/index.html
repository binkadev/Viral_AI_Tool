<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Viral AI Tool</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="titlebar">
    <div class="drag">
      <div class="app-icon">V</div>
      <strong>Viral AI Tool</strong>
      <span id="desktopPill" class="desktop-pill">Ứng dụng desktop</span>
    </div>
    <div class="window-controls">
      <button id="winMin" aria-label="Minimize">—</button>
      <button id="winMax" aria-label="Maximize">□</button>
      <button id="winClose" class="close" aria-label="Close">×</button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">V</div>
        <div>
          <div class="brand-name">VIRAL AI</div>
          <div class="brand-sub">TOOL · CREATOR STUDIO</div>
        </div>
      </div>

      <div class="workspace">
        <div>
          <span id="workspaceLabel">Không gian làm việc</span>
          <strong>Hoàng Studio</strong>
        </div>
        <i aria-hidden="true"></i>
      </div>

      <nav id="nav" aria-label="Primary"></nav>

      <div class="sidebar-bottom">
        <div class="credit-card">
          <div class="credit-head"><span id="creditsLabel">Tín dụng tháng</span><b>2,480</b></div>
          <div class="bar"><i style="width:66%"></i></div>
          <small><span>66%</span> <span id="remainingLabel">còn lại</span></small>
        </div>
        <div class="profile">
          <div class="avatar">NH</div>
          <div><b>Nhựt Hoàng</b><span>Creator Pro</span></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div id="breadcrumb" class="breadcrumb"></div>
          <h1 id="pageTitle"></h1>
        </div>
        <div class="top-actions">
          <button id="langToggle" class="language-switch" type="button" aria-label="Switch language">
            <span class="language-globe">文</span>
            <strong id="langCode">VI</strong>
          </button>
          <button id="quickProject" class="button primary" type="button">＋ <span id="newProjectLabel">Dự án mới</span></button>
        </div>
      </header>

      <section id="page" class="page" aria-live="polite"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal" class="modal-backdrop hidden"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
