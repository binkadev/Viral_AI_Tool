name: Core UX

on:
  push:
    branches:
      - core-ux-refactor
    paths:
      - "renderer/**"
      - "services/**"
      - "tests/core-editor.test.js"
      - "tests/cloud-speech-upload.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/core-ux.yml"
  pull_request:
    paths:
      - "renderer/**"
      - "services/**"
      - "tests/core-editor.test.js"
      - "tests/cloud-speech-upload.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/core-ux.yml"

permissions:
  contents: read

jobs:
  core-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies for contract tests
        # The desktop app intentionally ships a Windows-only sherpa runtime.
        # Linux CI does not execute that native binary; --force lets npm install
        # the lockfile so cross-platform JS/backend contracts can still run.
        run: npm ci --force

      - name: Keep production Cloud speech regression green
        run: npm run test:cloud-speech-upload

      - name: Test core editor model and UX contracts
        run: npm run test:core-editor

      - name: Syntax check core editor
        run: npm run check:core-editor

      - name: Keep production backend contract green
        run: npm run test:backend-production

      - name: Keep localized render pipeline green
        run: npm run test:render-e2e

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test core editor model and UX contracts
        run: npm run test:core-editor

      - name: Syntax check core editor
        run: npm run check:core-editor

      - name: Package Electron app
        run: npm run pack

      - name: Verify core editor is packaged
        shell: pwsh
        run: |
          $asar = Join-Path "release\win-unpacked\resources" "app.asar"
          if (-not (Test-Path $asar)) {
            throw "Packaged app.asar was not produced."
          }
          $listing = node node_modules/@electron/asar/bin/asar.js list $asar
          foreach ($required in @(
            "\renderer\core-editor.js",
            "\renderer\core-editor-model.js",
            "\renderer\core-editor-stability.js",
            "\renderer\core-editor.css",
            "\renderer\core-editor-stability.css",
            "\renderer\index.html"
          )) {
            if ($listing -notcontains $required) {
              throw "Packaged app is missing $required"
            }
          }
