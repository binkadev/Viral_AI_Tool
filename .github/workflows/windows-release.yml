name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
    paths:
      - "package.json"
      - "package-lock.json"
      - "main.js"
      - "preload.js"
      - "release-info.json"
      - "renderer/**"
      - "services/**"
      - "assets/**"
      - "tests/release-policy.test.js"
      - "tests/release-assets.test.js"
      - "tests/release-readiness.test.js"
      - "tests/generated-manifest.test.js"
      - "tests/update-client.test.js"
      - ".github/workflows/windows-release.yml"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tagged Stable releases require a non-prerelease X.Y.Z package version."
          }
          $expected = "v$($pkg.version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expected"
          }

      - name: Verify tagged release commit is on master
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch origin master --depth=1
          $masterSha = (git rev-parse origin/master).Trim()
          if ($env:GITHUB_SHA -ne $masterSha) {
            throw "Stable tag commit $env:GITHUB_SHA is not the current master commit $masterSha."
          }

      - name: Require Windows code signing for tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "Tagged releases require WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD repository secrets."
          }

      - name: Verify Windows release assets
        run: npm run test:release-assets

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run backend state tests
        run: npm run test:backend-state

      - name: Run restart/session integration tests
        run: npm run test:backend-restart

      - name: Run production SQLite integration tests
        run: npm run test:backend-production

      - name: Run release policy tests
        run: npm run test:release-policy

      - name: Run release readiness tests
        run: npm run test:release-readiness

      - name: Run update client tests
        run: npm run test:update-client

      - name: Prepare embedded release metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $channel = if ($env:GITHUB_REF -like "refs/tags/*") { "stable" } else { "preview" }
          $info = [ordered]@{
            schemaVersion = 1
            channel = $channel
            commit = $env:GITHUB_SHA
            builtAt = (Get-Date).ToUniversalTime().ToString("o")
            source = "github-actions"
            updateManifestUrl = "https://github.com/binkadev/Viral_AI_Tool/releases/latest/download/RELEASE-MANIFEST.json"
            releasePageUrl = "https://github.com/binkadev/Viral_AI_Tool/releases/latest"
          }
          $info | ConvertTo-Json | Set-Content -Path release-info.json -Encoding utf8
          Get-Content release-info.json

      - name: Build Windows NSIS installer
        run: npm run dist

      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $installer = Get-ChildItem release -File -Filter "*.exe" | Where-Object {
            $_.Name -notlike "__uninstaller-*"
          } | Select-Object -First 1

          if (-not $installer) {
            throw "Windows installer was not produced."
          }

          $installDir = "C:\ViralAIToolSmoke-$env:GITHUB_RUN_ID"
          if (Test-Path $installDir) {
            Remove-Item $installDir -Recurse -Force
          }

          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Silent installer failed with exit code $($process.ExitCode)."
          }

          $appExe = Join-Path $installDir "Viral AI Tool.exe"
          if (-not (Test-Path $appExe)) {
            throw "Installed Viral AI Tool executable was not found."
          }

          $versionInfo = (Get-Item $appExe).VersionInfo
          if ($versionInfo.ProductVersion -notlike "$($pkg.version)*") {
            throw "Installed ProductVersion $($versionInfo.ProductVersion) does not match package version $($pkg.version)."
          }

          $appProcess = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 5

          if ($appProcess.HasExited) {
            throw "Installed Viral AI Tool exited during startup smoke test with code $($appProcess.ExitCode)."
          }

          Stop-Process -Id $appProcess.Id -Force
          $appProcess.WaitForExit()

          $uninstaller = Get-ChildItem $installDir -File | Where-Object {
            $_.Name -like "Uninstall*.exe"
          } | Select-Object -First 1

          if (-not $uninstaller) {
            throw "NSIS uninstaller was not found."
          }

          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Silent uninstaller failed with exit code $($uninstall.ExitCode)."
          }

          Start-Sleep -Milliseconds 500
          if (Test-Path $installDir) {
            Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Verify Authenticode signatures for tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -File -Filter "*.exe" | Where-Object {
            $_.Name -notlike "__uninstaller-*"
          } | Select-Object -First 1

          if (-not $installer) {
            throw "Signed Windows installer was not produced."
          }

          $installerSignature = Get-AuthenticodeSignature $installer.FullName
          if ($installerSignature.Status -ne "Valid") {
            throw "Installer Authenticode signature is not valid: $($installerSignature.Status)"
          }

          $unpackedExe = Join-Path "release\win-unpacked" "Viral AI Tool.exe"
          if (-not (Test-Path $unpackedExe)) {
            throw "Packaged executable was not found for signature verification."
          }

          $appSignature = Get-AuthenticodeSignature $unpackedExe
          if ($appSignature.Status -ne "Valid") {
            throw "Application Authenticode signature is not valid: $($appSignature.Status)"
          }

          Write-Host "Installer signer: $($installerSignature.SignerCertificate.Subject)"
          Write-Host "Application signer: $($appSignature.SignerCertificate.Subject)"

      - name: Generate release manifest and SHA-256 checksums
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $channel = if ($env:GITHUB_REF -like "refs/tags/*") { "stable" } else { "preview" }
          $files = Get-ChildItem release -File | Where-Object {
            $_.Extension -in ".exe", ".blockmap", ".yml"
          }
          if (-not $files) {
            throw "No release artifacts were produced."
          }

          $artifacts = @()
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $artifact = [ordered]@{
              file = $file.Name
              sizeBytes = $file.Length
              sha256 = $hash
            }
            if ($channel -eq "stable" -and $file.Extension -eq ".exe") {
              $encodedName = [uri]::EscapeDataString($file.Name)
              $artifact.downloadUrl = "https://github.com/binkadev/Viral_AI_Tool/releases/download/v$($pkg.version)/$encodedName"
            }
            $artifacts += $artifact
            "$hash  $($file.Name)"
          }

          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii

          $manifest = [ordered]@{
            schemaVersion = 1
            product = "Viral AI Tool"
            version = $pkg.version
            channel = $channel
            commit = $env:GITHUB_SHA
            builtAt = (Get-Date).ToUniversalTime().ToString("o")
            platform = "win32"
            arch = "x64"
            releasePage = "https://github.com/binkadev/Viral_AI_Tool/releases/tag/v$($pkg.version)"
            artifacts = $artifacts
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path release/RELEASE-MANIFEST.json -Encoding utf8

          Get-Content release/SHA256SUMS.txt
          Get-Content release/RELEASE-MANIFEST.json

      - name: Validate generated release manifest
        run: npm run test:generated-manifest

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Viral-AI-Tool-Windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/SHA256SUMS.txt
            release/RELEASE-MANIFEST.json
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes --title "Viral AI Tool $env:GITHUB_REF_NAME"

          Get-ChildItem release -File | Where-Object {
            $_.Extension -in ".exe", ".blockmap", ".yml" -or $_.Name -in "SHA256SUMS.txt", "RELEASE-MANIFEST.json"
          } | ForEach-Object {
            gh release upload $env:GITHUB_REF_NAME $_.FullName --clobber
          }
