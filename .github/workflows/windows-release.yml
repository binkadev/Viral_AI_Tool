name: Windows Release

on:
  workflow_dispatch:
    inputs:
      stable_candidate:
        description: "Run Stable release guards without creating a tag or GitHub Release"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
    paths:
      - "package.json"
      - "package-lock.json"
      - "main.js"
      - "preload.js"
      - "release-info.json"
      - "renderer/**"
      - "services/**"
      - "dev-backend/**"
      - "assets/**"
      - "tests/release-policy.test.js"
      - "tests/release-assets.test.js"
      - "tests/release-readiness.test.js"
      - "tests/generated-manifest.test.js"
      - "tests/update-client.test.js"
      - "tests/windows-signature.test.js"
      - "tests/windows-signature.integration.test.js"
      - "tests/diagnostics.test.js"
      - "tests/cloud-release-config.test.js"
      - "tests/render-pipeline.integration.test.js"
      - ".github/workflows/windows-release.yml"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.stable_candidate && 'stable-candidate' || 'validation' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.stable_candidate) }}

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      PRODUCTION_CLOUD_URL: ${{ vars.PRODUCTION_CLOUD_URL }}
      PRODUCTION_BILLING_READY: ${{ vars.PRODUCTION_BILLING_READY }}
      PREVIEW_CLOUD_URL: ${{ vars.PREVIEW_CLOUD_URL }}
      STABLE_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.stable_candidate }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tagged Stable releases require a non-prerelease X.Y.Z package version."
          }
          $expected = "v$($pkg.version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expected"
          }

      - name: Verify tagged release commit is on master
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch origin master --depth=1
          $masterSha = (git rev-parse origin/master).Trim()
          if ($env:GITHUB_SHA -ne $masterSha) {
            throw "Stable tag commit $env:GITHUB_SHA is not the current master commit $masterSha."
          }

      - name: Verify Stable Candidate commit is current master
        if: env.STABLE_CANDIDATE == 'true'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/master") {
            throw "Stable Candidate dry run must be dispatched from master."
          }
          git fetch origin master --depth=1
          $masterSha = (git rev-parse origin/master).Trim()
          if ($env:GITHUB_SHA -ne $masterSha) {
            throw "Stable Candidate commit $env:GITHUB_SHA is not the current master commit $masterSha."
          }

      - name: Require Windows code signing for Stable release
        if: startsWith(github.ref, 'refs/tags/') || env.STABLE_CANDIDATE == 'true'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "Tagged releases require WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD repository secrets."
          }

      - name: Verify production release configuration
        if: startsWith(github.ref, 'refs/tags/') || env.STABLE_CANDIDATE == 'true'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRODUCTION_CLOUD_URL)) {
            throw "Tagged Stable releases require repository variable PRODUCTION_CLOUD_URL."
          }

          $cloudUri = $null
          if (-not [System.Uri]::TryCreate($env:PRODUCTION_CLOUD_URL, [System.UriKind]::Absolute, [ref]$cloudUri)) {
            throw "PRODUCTION_CLOUD_URL is not a valid absolute URL."
          }
          if ($cloudUri.Scheme -ne "https") {
            throw "PRODUCTION_CLOUD_URL must use HTTPS."
          }
          if (-not [string]::IsNullOrEmpty($cloudUri.UserInfo)) {
            throw "PRODUCTION_CLOUD_URL must not contain credentials."
          }

          if ($env:PRODUCTION_BILLING_READY -ne "true") {
            throw "Tagged Stable releases require PRODUCTION_BILLING_READY=true."
          }

          $base = $env:PRODUCTION_CLOUD_URL.TrimEnd("/")
          try {
            $health = Invoke-RestMethod -Uri "$base/health" -Method Get -TimeoutSec 12
          } catch {
            throw "Production backend health check failed: $($_.Exception.Message)"
          }

          if ($health.environment -ne "production") {
            throw "Production backend health reports environment=$($health.environment)."
          }
          if ($health.stateDriver -ne "sqlite" -or $health.durableState -ne $true) {
            throw "Production backend must report durable SQLite state."
          }
          if ($health.shuttingDown -eq $true) {
            throw "Production backend is currently shutting down."
          }

          try {
            $readiness = Invoke-RestMethod -Uri "$base/ready" -Method Get -TimeoutSec 12
          } catch {
            throw "Production backend readiness check failed: $($_.Exception.Message)"
          }

          if ($readiness.ready -ne $true) {
            throw "Production backend is not operationally ready."
          }
          if ($readiness.releaseReady -ne $true) {
            throw "Production backend is operational but not release-ready."
          }

          $billing = $readiness.checks.billing
          if ($null -eq $billing -or $billing.ready -ne $true) {
            throw "Production billing readiness contract is not ready."
          }

          foreach ($check in @("providerConfigured", "checkoutReady", "portalReady", "invoicesReady", "webhookReady")) {
            if ($billing.checks.$check -ne $true) {
              throw "Production billing readiness failed: $check=false"
            }
          }

      - name: Verify Windows release assets
        run: npm run test:release-assets

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run backend state tests
        run: npm run test:backend-state

      - name: Run restart/session integration tests
        run: npm run test:backend-restart

      - name: Run production SQLite integration tests
        run: npm run test:backend-production

      - name: Run release policy tests
        run: npm run test:release-policy

      - name: Run release readiness tests
        run: npm run test:release-readiness

      - name: Run update client tests
        run: npm run test:update-client

      - name: Run Windows update signature tests
        run: npm run test:update-signature

      - name: Run diagnostics privacy tests
        run: npm run test:diagnostics

      - name: Run embedded Cloud release config tests
        run: npm run test:cloud-release-config

      - name: Run localized render end-to-end test
        run: npm run test:render-e2e

      - name: Prepare embedded release metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $channel = if ($env:GITHUB_REF -like "refs/tags/*" -or $env:STABLE_CANDIDATE -eq "true") { "stable" } else { "preview" }
          $cloudBackendUrl = if ($channel -eq "stable") {
            $env:PRODUCTION_CLOUD_URL
          } else {
            $env:PREVIEW_CLOUD_URL
          }
          if ([string]::IsNullOrWhiteSpace($cloudBackendUrl)) {
            $cloudBackendUrl = $null
          } else {
            $cloudBackendUrl = $cloudBackendUrl.TrimEnd("/")
          }

          $info = [ordered]@{
            schemaVersion = 1
            channel = $channel
            commit = $env:GITHUB_SHA
            builtAt = (Get-Date).ToUniversalTime().ToString("o")
            source = "github-actions"
            updateManifestUrl = "https://github.com/binkadev/Viral_AI_Tool/releases/latest/download/RELEASE-MANIFEST.json"
            releasePageUrl = "https://github.com/binkadev/Viral_AI_Tool/releases/latest"
            cloudBackendUrl = $cloudBackendUrl
          }
          $info | ConvertTo-Json | Set-Content -Path release-info.json -Encoding utf8
          Get-Content release-info.json

      - name: Build Windows NSIS installer
        run: npm run dist

      - name: Verify packaged release contents
        shell: pwsh
        run: |
          $asar = Join-Path "release\win-unpacked\resources" "app.asar"
          if (-not (Test-Path $asar)) {
            throw "Packaged app.asar was not produced."
          }

          $listing = node node_modules/@electron/asar/bin/asar.js list $asar
          foreach ($required in @(
            "\release-info.json",
            "\main.js",
            "\preload.js",
            "\services\update\update-client.js",
            "\services\update\release-policy.js",
            "\services\diagnostics\logger.js",
            "\services\diagnostics\bundle.js",
            "\renderer\index.html"
          )) {
            if ($listing -notcontains $required) {
              throw "Packaged app.asar is missing required file: $required"
            }
          }

      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $installer = Get-ChildItem release -File -Filter "*.exe" | Where-Object {
            $_.Name -notlike "__uninstaller-*"
          } | Select-Object -First 1

          if (-not $installer) {
            throw "Windows installer was not produced."
          }

          $installDir = "C:\ViralAIToolSmoke-$env:GITHUB_RUN_ID"
          if (Test-Path $installDir) {
            Remove-Item $installDir -Recurse -Force
          }

          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Silent installer failed with exit code $($process.ExitCode)."
          }

          $appExe = Join-Path $installDir "Viral AI Tool.exe"
          if (-not (Test-Path $appExe)) {
            throw "Installed Viral AI Tool executable was not found."
          }

          $versionInfo = (Get-Item $appExe).VersionInfo
          if ($versionInfo.ProductVersion -notlike "$($pkg.version)*") {
            throw "Installed ProductVersion $($versionInfo.ProductVersion) does not match package version $($pkg.version)."
          }

          $appProcess = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 5

          if ($appProcess.HasExited) {
            throw "Installed Viral AI Tool exited during startup smoke test with code $($appProcess.ExitCode)."
          }

          Stop-Process -Id $appProcess.Id -Force
          $appProcess.WaitForExit()

          $uninstaller = Get-ChildItem $installDir -File | Where-Object {
            $_.Name -like "Uninstall*.exe"
          } | Select-Object -First 1

          if (-not $uninstaller) {
            throw "NSIS uninstaller was not found."
          }

          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Silent uninstaller failed with exit code $($uninstall.ExitCode)."
          }

          Start-Sleep -Milliseconds 500
          if (Test-Path $installDir) {
            Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Verify Authenticode signatures for Stable release
        if: startsWith(github.ref, 'refs/tags/') || env.STABLE_CANDIDATE == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -File -Filter "*.exe" | Where-Object {
            $_.Name -notlike "__uninstaller-*"
          } | Select-Object -First 1

          if (-not $installer) {
            throw "Signed Windows installer was not produced."
          }

          $installerSignature = Get-AuthenticodeSignature $installer.FullName
          if ($installerSignature.Status -ne "Valid") {
            throw "Installer Authenticode signature is not valid: $($installerSignature.Status)"
          }

          $unpackedExe = Join-Path "release\win-unpacked" "Viral AI Tool.exe"
          if (-not (Test-Path $unpackedExe)) {
            throw "Packaged executable was not found for signature verification."
          }

          $appSignature = Get-AuthenticodeSignature $unpackedExe
          if ($appSignature.Status -ne "Valid") {
            throw "Application Authenticode signature is not valid: $($appSignature.Status)"
          }

          Write-Host "Installer signer: $($installerSignature.SignerCertificate.Subject)"
          Write-Host "Application signer: $($appSignature.SignerCertificate.Subject)"

      - name: Verify updater publisher rule for Stable release
        if: startsWith(github.ref, 'refs/tags/') || env.STABLE_CANDIDATE == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -File -Filter "*.exe" | Where-Object {
            $_.Name -notlike "__uninstaller-*"
          } | Select-Object -First 1

          if (-not $installer) {
            throw "Signed Windows installer was not produced."
          }

          $env:VIRAL_AI_CURRENT_EXE = (Resolve-Path "release\win-unpacked\Viral AI Tool.exe").Path
          $env:VIRAL_AI_UPDATE_INSTALLER = $installer.FullName
          npm run test:update-signature-live

      - name: Generate release manifest and SHA-256 checksums
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $channel = if ($env:GITHUB_REF -like "refs/tags/*" -or $env:STABLE_CANDIDATE -eq "true") { "stable" } else { "preview" }
          $files = Get-ChildItem release -File | Where-Object {
            $_.Extension -in ".exe", ".blockmap" -or $_.Name -eq "latest.yml"
          }
          if (-not $files) {
            throw "No release artifacts were produced."
          }

          $artifacts = @()
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $artifact = [ordered]@{
              file = $file.Name
              sizeBytes = $file.Length
              sha256 = $hash
            }
            if ($channel -eq "stable" -and $file.Extension -eq ".exe") {
              $encodedName = [uri]::EscapeDataString($file.Name)
              $artifact.downloadUrl = "https://github.com/binkadev/Viral_AI_Tool/releases/download/v$($pkg.version)/$encodedName"
            }
            $artifacts += $artifact
            "$hash  $($file.Name)"
          }

          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii

          $manifest = [ordered]@{
            schemaVersion = 1
            product = "Viral AI Tool"
            version = $pkg.version
            channel = $channel
            commit = $env:GITHUB_SHA
            builtAt = (Get-Date).ToUniversalTime().ToString("o")
            platform = "win32"
            arch = "x64"
            releasePage = "https://github.com/binkadev/Viral_AI_Tool/releases/tag/v$($pkg.version)"
            artifacts = $artifacts
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path release/RELEASE-MANIFEST.json -Encoding utf8

          Get-Content release/SHA256SUMS.txt
          Get-Content release/RELEASE-MANIFEST.json

      - name: Validate generated release manifest
        run: npm run test:generated-manifest

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Viral-AI-Tool-Windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/RELEASE-MANIFEST.json
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existingDraft = gh release view $env:GITHUB_REF_NAME --json isDraft --jq ".isDraft" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --verify-tag --draft --generate-notes --title "Viral AI Tool $env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub draft Release creation failed for $env:GITHUB_REF_NAME."
            }
            Write-Host "Created draft GitHub Release $env:GITHUB_REF_NAME."
          } elseif ($existingDraft.Trim() -ne "true") {
            throw "GitHub Release $env:GITHUB_REF_NAME is already published. Refusing to mutate published Stable assets."
          } else {
            Write-Host "Draft GitHub Release $env:GITHUB_REF_NAME already exists; reusing it for this rerun."
          }

          Get-ChildItem release -File | Where-Object {
            $_.Extension -in ".exe", ".blockmap" -or $_.Name -in "latest.yml", "SHA256SUMS.txt", "RELEASE-MANIFEST.json"
          } | ForEach-Object {
            gh release upload $env:GITHUB_REF_NAME $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release asset: $($_.Name)"
            }
          }

          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish GitHub Release $env:GITHUB_REF_NAME."
          }
