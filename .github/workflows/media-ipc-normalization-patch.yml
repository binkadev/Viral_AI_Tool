name: Normalize Media IPC Wiring

on:
  push:
    branches: [feat/media-engine-workbench]
    paths:
      - "scripts/normalize-media-ipc-wiring.js"
      - ".github/workflows/media-ipc-normalization-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-engine-workbench
          fetch-depth: 0

      - name: Apply IPC normalization
        run: node scripts/normalize-media-ipc-wiring.js

      - name: Verify focused contracts
        run: |
          node --check main.js
          node --check services/media/desktop-ipc.js
          node tests/media-desktop-ipc.test.js
          node tests/media-workbench-wiring.test.js
          node tests/core-media-workbench.test.js
          git diff --check

      - name: Commit normalized wiring and remove patch scaffolding
        shell: bash
        run: |
          rm -f scripts/normalize-media-ipc-wiring.js .github/workflows/media-ipc-normalization-patch.yml
          git config user.name "Viral AI Tool Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: centralize media IPC boundary"
          git push origin HEAD:feat/media-engine-workbench
