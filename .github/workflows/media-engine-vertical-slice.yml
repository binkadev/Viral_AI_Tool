name: Media Engine Vertical Slice

on:
  push:
    branches: [feat/media-engine-vertical-slice]

permissions:
  contents: write

concurrency:
  group: media-engine-vertical-slice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/media-engine-vertical-slice
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded integration patch
        run: node scripts/apply-media-engine-vertical-slice.js

      - name: Check syntax
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check dev-backend/server.js
          node --check services/media/cloud-client.js
          node --check dev-backend/media-search.js
          node --check dev-backend/media-routes.js
          node --check dev-backend/providers/pexels-media.js
          node --check dev-backend/providers/pixabay-media.js

      - name: Install locked dependencies
        run: npm ci

      - name: Run Media Engine regression
        run: npm run test:media-engine-search

      - name: Commit generated integration changes
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add main.js preload.js dev-backend/server.js .env.example package.json
            git commit -m "feat: wire media search through desktop and backend"
            git push origin HEAD:feat/media-engine-vertical-slice
          } else {
            Write-Host "No integration changes to commit."
          }
