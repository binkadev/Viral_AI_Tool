name: Apply Media Add-to-Project UI Patch

on:
  push:
    branches: [feat/media-engine-runtime]
    paths:
      - "scripts/enable-media-add-to-project.js"
      - ".github/workflows/media-add-ui-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-engine-runtime
          fetch-depth: 0
      - name: Apply guarded renderer patch
        run: node scripts/enable-media-add-to-project.js
      - name: Verify syntax and diff
        run: |
          node --check renderer/core-editor-assets.js
          git diff --check
          git diff -- renderer/core-editor-assets.js
      - name: Commit renderer acquisition integration
        shell: bash
        run: |
          if git diff --quiet -- renderer/core-editor-assets.js; then exit 0; fi
          git config user.name "Viral AI Tool Automation"
          git config user.email "actions@users.noreply.github.com"
          git add renderer/core-editor-assets.js
          git commit -m "feat: enable safe add-to-project media flow [media-add-ui-applied]"
          git push origin HEAD:feat/media-engine-runtime
