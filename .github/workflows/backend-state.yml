name: Backend State

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  durable-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test durable backend state
        run: node dev-backend/tests/state-persistence.test.js

      - name: Test backend restart and sessions
        run: node dev-backend/tests/server-restart.integration.test.js

      - name: Test production SQLite mode
        run: node dev-backend/tests/production-mode.integration.test.js

      - name: Test SQLite backup and retention
        run: npm run test:backend-backup

      - name: Test release policy
        run: node tests/release-policy.test.js

      - name: Test diagnostics privacy
        run: npm run test:diagnostics

      - name: Test production deployment config
        run: npm run test:deployment-config

      - name: Test Cloud speech upload routing
        run: npm run test:cloud-speech-upload

      - name: Syntax check hardened backend
        run: |
          node --check dev-backend/server.js
          node --check dev-backend/billing.js
          node --check dev-backend/state-store.js
          node --check dev-backend/state-store-sqlite.js
          node --check dev-backend/sqlite-backup.js
          node --check dev-backend/maintenance/state-backup.js
          node --check dev-backend/tests/sqlite-backup.test.js
          node --check dev-backend/tests/production-mode.integration.test.js
          node --check dev-backend/audit-log.js
          node --check services/auth/auth-client.js
          node --check services/update/release-policy.js
          node --check services/update/update-client.js
          node --check tests/release-policy.test.js
          node --check main.js
          node --check preload.js
          node --check renderer/app.js
          node --check renderer/i18n.js
          node --check scripts/release-preflight.js
