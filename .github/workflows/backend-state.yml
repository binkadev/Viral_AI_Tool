name: Backend State

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  durable-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test durable backend state
        run: node dev-backend/tests/state-persistence.test.js

      - name: Test backend restart and sessions
        run: node dev-backend/tests/server-restart.integration.test.js

      - name: Test production SQLite mode
        run: node dev-backend/tests/production-mode.integration.test.js

      - name: Test SQLite backup and retention
        run: npm run test:backend-backup

      - name: Test release policy
        run: node tests/release-policy.test.js

      - name: Test diagnostics privacy
        run: npm run test:diagnostics

      - name: Test production deployment config
        run: npm run test:deployment-config

      - name: Test Cloud speech upload routing
        run: npm run test:cloud-speech-upload

      - name: Test reusable core async states
        run: npm run test:core-job-model

      - name: Test core player synchronization
        run: npm run test:core-player

      - name: Test core transcript editing
        run: npm run test:core-transcript

      - name: Test core workflow gating
        run: npm run test:core-workflow

      - name: Test core editor layout
        run: npm run test:core-layout

      - name: Test core capability guard
        run: npm run test:core-capabilities

      - name: Test project reopen media recovery
        run: npm run test:core-media-restore

      - name: Syntax check hardened backend
        run: |
          node --check dev-backend/server.js
          node --check dev-backend/billing.js
          node --check dev-backend/state-store.js
          node --check dev-backend/state-store-sqlite.js
          node --check dev-backend/sqlite-backup.js
          node --check dev-backend/maintenance/state-backup.js
          node --check dev-backend/tests/sqlite-backup.test.js
          node --check dev-backend/tests/production-mode.integration.test.js
          node --check dev-backend/audit-log.js
          node --check services/auth/auth-client.js
          node --check services/update/release-policy.js
          node --check services/update/update-client.js
          node --check tests/release-policy.test.js
          node --check tests/core-job-model.test.js
          node --check tests/core-player.test.js
          node --check tests/core-transcript.test.js
          node --check tests/core-workflow.test.js
          node --check tests/core-layout.test.js
          node --check tests/core-capabilities.test.js
          node --check tests/core-media-restore.test.js
          node --check main.js
          node --check preload.js
          node --check renderer/app.js
          node --check renderer/i18n.js
          node --check renderer/core-job-model.js
          node --check renderer/core-player-model.js
          node --check renderer/core-player.js
          node --check renderer/core-player-interactions.js
          node --check renderer/core-transcript-model.js
          node --check renderer/core-transcript-state.js
          node --check renderer/core-workflow-model.js
          node --check renderer/core-workflow.js
          node --check renderer/core-layout.js
          node --check renderer/core-capabilities.js
          node --check renderer/core-media-restore.js
          node --check scripts/release-preflight.js
