name: Apply Media Acquisition Main Patch

on:
  push:
    branches: [feat/media-engine-runtime]
    paths:
      - "scripts/apply-media-acquisition-main.js"
      - ".github/workflows/media-acquisition-main-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-engine-runtime
          fetch-depth: 0
      - name: Apply guarded main-process patch
        run: node scripts/apply-media-acquisition-main.js
      - name: Verify syntax and diff
        run: |
          node --check main.js
          git diff --check
          git diff -- main.js
      - name: Commit acquisition integration
        shell: bash
        run: |
          if git diff --quiet -- main.js; then exit 0; fi
          git config user.name "Viral AI Tool Automation"
          git config user.email "actions@users.noreply.github.com"
          git add main.js
          git commit -m "feat: connect media acquisition runtime [media-acquisition-applied]"
          git push origin HEAD:feat/media-engine-runtime
