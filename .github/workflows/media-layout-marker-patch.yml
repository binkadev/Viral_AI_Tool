name: Apply Media Layout Marker Patch

on:
  push:
    branches: [feat/media-engine-runtime]
    paths:
      - "scripts/patch-media-layout-markers.js"
      - ".github/workflows/media-layout-marker-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-engine-runtime
          fetch-depth: 0
      - run: node scripts/patch-media-layout-markers.js
      - run: |
          node --check renderer/core-editor-assets.js
          git diff --check
      - shell: bash
        run: |
          if git diff --quiet -- renderer/core-editor-assets.js; then exit 0; fi
          git config user.name "Viral AI Tool Automation"
          git config user.email "actions@users.noreply.github.com"
          git add renderer/core-editor-assets.js
          git commit -m "fix: preserve media layout markers [media-layout-applied]"
          git push origin HEAD:feat/media-engine-runtime
