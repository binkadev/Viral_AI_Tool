name: Scene Planner Regression

on:
  push:
    branches: [master]
    paths:
      - "renderer/core-scene-plan-model.js"
      - "renderer/core-project-snapshot.js"
      - "renderer/core-project-persistence.js"
      - "renderer/core-transcript-state.js"
      - "renderer/index.html"
      - "tests/core-scene-plan-model.test.js"
      - "tests/core-scene-plan-collision.test.js"
      - "tests/core-scene-plan-persistence.test.js"
      - "tests/core-project-persistence.test.js"
      - "docs/SCENE_PLANNER_SPEC.md"
      - ".github/workflows/scene-planner.yml"
  pull_request:
    branches: [master]
    paths:
      - "renderer/core-scene-plan-model.js"
      - "renderer/core-project-snapshot.js"
      - "renderer/core-project-persistence.js"
      - "renderer/core-transcript-state.js"
      - "renderer/index.html"
      - "tests/core-scene-plan-model.test.js"
      - "tests/core-scene-plan-collision.test.js"
      - "tests/core-scene-plan-persistence.test.js"
      - "tests/core-project-persistence.test.js"
      - "docs/SCENE_PLANNER_SPEC.md"
      - ".github/workflows/scene-planner.yml"

permissions:
  contents: read

concurrency:
  group: scene-planner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scene-planner-domain:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          node --check renderer/core-scene-plan-model.js
          node --check renderer/core-project-snapshot.js
          node --check renderer/core-project-persistence.js
          node --check renderer/core-transcript-state.js

      - name: Run Scene Planner domain and persistence regressions
        run: |
          node tests/core-scene-plan-model.test.js
          if (Test-Path tests/core-scene-plan-collision.test.js) { node tests/core-scene-plan-collision.test.js }
          node tests/core-scene-plan-persistence.test.js
          node tests/core-project-persistence.test.js
