name: Scene Planner Regression

on:
  push:
    branches: [master]
    paths:
      - "renderer/core-scene-plan-model.js"
      - "renderer/core-project-scene-plan.js"
      - "renderer/core-scene-plan-runtime.js"
      - "renderer/index.html"
      - "tests/core-scene-plan-model.test.js"
      - "tests/core-scene-plan-persistence.test.js"
      - "docs/SCENE_PLANNER_SPEC.md"
      - ".github/workflows/scene-planner.yml"
  pull_request:
    branches: [master]
    paths:
      - "renderer/core-scene-plan-model.js"
      - "renderer/core-project-scene-plan.js"
      - "renderer/core-scene-plan-runtime.js"
      - "renderer/index.html"
      - "tests/core-scene-plan-model.test.js"
      - "tests/core-scene-plan-persistence.test.js"
      - "docs/SCENE_PLANNER_SPEC.md"
      - ".github/workflows/scene-planner.yml"

permissions:
  contents: read

concurrency:
  group: scene-planner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scene-planner-domain:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          node --check renderer/core-scene-plan-model.js
          node --check renderer/core-project-scene-plan.js
          node --check renderer/core-scene-plan-runtime.js

      - name: Run Scene Planner domain regression
        run: node tests/core-scene-plan-model.test.js

      - name: Run Scene Planner persistence regression
        run: node tests/core-scene-plan-persistence.test.js
