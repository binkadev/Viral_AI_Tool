name: PR 38 Media Review Fixes

on:
  push:
    branches: [feat/media-engine-block5-commercial]

permissions:
  contents: write

concurrency:
  group: pr38-media-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/media-engine-block5-commercial
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply reviewed fixes
        run: node scripts/fix-pr38-review.js

      - name: Syntax checks
        shell: pwsh
        run: |
          node --check main.js
          node --check renderer/core-media-discovery.js
          node --check renderer/i18n.js

      - name: Install dependencies
        run: npm ci

      - name: Review regression
        run: node tests/media-pr38-review-regression.test.js

      - name: Media regression
        run: npm run test:media-engine-search

      - name: Commercial regression
        run: npm run test:core-commercial

      - name: Commit verified fixes
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add main.js renderer/core-media-discovery.js renderer/i18n.js
            git commit -m "fix: close media acquisition review gaps"
            git push origin HEAD:feat/media-engine-block5-commercial
          } else {
            Write-Host "No generated changes to commit."
          }
