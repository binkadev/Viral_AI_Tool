name: Finalize Media Review Copy

on:
  push:
    branches: [feat/media-engine-workbench]
    paths:
      - "scripts/finalize-media-review-copy.js"
      - ".github/workflows/finalize-media-review-copy.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-engine-workbench
          fetch-depth: 0

      - name: Apply guarded copy and deployment docs patch
        run: node scripts/finalize-media-review-copy.js

      - name: Verify syntax and deployment docs
        run: |
          node --check renderer/core-media-discovery.js
          npm run test:deployment-config
          git diff --check

      - name: Commit verified patch and remove scaffolding
        run: |
          rm -f scripts/finalize-media-review-copy.js .github/workflows/finalize-media-review-copy.yml
          git config user.name "Viral AI Tool Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: finalize media localization and production setup"
          git push origin HEAD:feat/media-engine-workbench
