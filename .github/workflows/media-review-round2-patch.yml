name: Apply Final Media Review Fixes

on:
  push:
    branches: [feat/media-engine-workbench]
    paths:
      - "scripts/fix-media-review-round2.js"
      - ".github/workflows/media-review-round2-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-engine-workbench
          fetch-depth: 0

      - name: Apply guarded final review fixes
        run: node scripts/fix-media-review-round2.js

      - name: Verify syntax and focused media contracts
        run: |
          node --check services/media/desktop-ipc.js
          node --check dev-backend/media-routes.js
          node --check renderer/core-media-discovery.js
          node --check renderer/i18n.js
          node tests/media-routes.test.js
          node tests/media-desktop-ipc.test.js
          node tests/core-media-workbench.test.js
          node tests/media-workbench-wiring.test.js
          git diff --check

      - name: Commit verified fixes and remove patch scaffolding
        run: |
          rm -f scripts/fix-media-review-round2.js .github/workflows/media-review-round2-patch.yml
          git config user.name "Viral AI Tool Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: harden media discovery cancellation and responsive recovery"
          git push origin HEAD:feat/media-engine-workbench
