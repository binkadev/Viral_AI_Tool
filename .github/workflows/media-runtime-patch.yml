name: Apply Media Runtime Integration

on:
  push:
    branches: [feat/media-engine-runtime]
    paths:
      - "scripts/apply-media-runtime-integration.js"
      - ".github/workflows/media-runtime-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/media-engine-runtime
          fetch-depth: 0

      - name: Apply guarded integration patch
        run: node scripts/apply-media-runtime-integration.js

      - name: Verify syntax and diff
        run: |
          node --check dev-backend/server.js
          node --check main.js
          git diff --check
          git diff -- dev-backend/server.js main.js

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- dev-backend/server.js main.js; then
            echo "No runtime integration changes to commit."
            exit 0
          fi
          git config user.name "Viral AI Tool Automation"
          git config user.email "actions@users.noreply.github.com"
          git add dev-backend/server.js main.js
          git commit -m "feat: connect media discovery runtime [media-runtime-applied]"
          git push origin HEAD:feat/media-engine-runtime
