name: Core Commercial Regression

on:
  push:
    branches: [master]
    paths:
      - "main.js"
      - "preload.js"
      - "renderer/**"
      - "services/media/**"
      - "dev-backend/server.js"
      - "dev-backend/media-search.js"
      - "dev-backend/media-routes.js"
      - "dev-backend/providers/*-media.js"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/core-commercial.yml"
  pull_request:
    branches: [master]
    paths:
      - "main.js"
      - "preload.js"
      - "renderer/**"
      - "services/media/**"
      - "dev-backend/server.js"
      - "dev-backend/media-search.js"
      - "dev-backend/media-routes.js"
      - "dev-backend/providers/*-media.js"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/core-commercial.yml"

permissions:
  contents: read

concurrency:
  group: core-commercial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commercial-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run commercial regression suite
        run: npm run test:core-commercial

      - name: Run media engine search regression
        run: npm run test:media-engine-search

      - name: Run media desktop IPC regression
        run: node tests/media-desktop-ipc.test.js

      - name: Run media workbench regression
        run: node tests/core-media-workbench.test.js

      - name: Run media workbench wiring regression
        run: node tests/media-workbench-wiring.test.js
